app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  log_level: "info"

model:
  checkpoint_path: "checkpoints/best_unet.pth"
  hf_repo_id: "ishaan1402/crack-seg"
  hf_filename: "best_unet.pth"
  in_channels: 3
  out_channels: 1
  # Published weights are the "narrow" HPO variant; the loader auto-detects
  # this from the checkpoint and remaps legacy key names, so this list is
  # informational only.
  features: [32, 64, 128, 256]

inference:
  patch_size: 448
  overlap: 0.5
  sigma_scale: 0.125
  default_threshold: 0.5
  # CPU-friendly default (measured fastest on Apple/MKL CPU paths). The
  # predictor automatically raises this to 8 on CUDA unless overridden.
  batch_size: 1
  tta: false

metrics:
  density_cell_size: 64
  max_density_threshold: 0.05
