[tool.poetry]
name = "crack-seg"
version = "0.1.0"
description = "Deep learning semantic segmentation pipeline for bridge crack mapping."
authors = ["Ishaan <ishaan@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2.0"
torchvision = "^0.17.0"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
python-multipart = "^0.0.9"
numpy = "^1.24.0"
opencv-python-headless = "^4.9.0"
albumentations = "^1.4.0"
pyyaml = "^6.0.1"
huggingface-hub = "^0.21.0"
scikit-image = "^0.22.0"
scikit-learn = "^1.4.0"
matplotlib = "^3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"
black = "^24.2.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
