app:
  host: "0.0.0.0"
  port: 8000
  debug: false
  log_level: "info"

model:
  checkpoint_path: "checkpoints/unet_v3.pth"
  hf_repo_id: "ishaan1402/crack-seg"
  hf_filename: "unet_v3.pth"
  in_channels: 3
  out_channels: 1
  # Informational only: the loader auto-detects widths from the checkpoint.
  features: [32, 64, 128, 256]

inference:
  patch_size: 448
  overlap: 0.5
  sigma_scale: 0.125
  default_threshold: 0.5
  # 0 = auto: 1 on CPU (measured fastest for this model), 8 on CUDA.
  batch_size: 0
  tta: false

metrics:
  density_cell_size: 64
  max_density_threshold: 0.05
